name: backend deploy

# main에 push될 때만 실행. backend push가 frontend/ai-service까지 다시 배포하지 않도록 각 repo가
# 자기 자신만 빌드/배포한다(3개 repo 각자 별도 워크플로).
on:
  push:
    branches: [main]

# 짧은 시간에 여러 push가 겹쳐도 배포끼리 경쟁하지 않게 - 최신 push만 실제로 배포되면 되므로
# 진행 중인 실행은 취소하고 최신 것으로 교체한다.
concurrency:
  group: deploy-backend-production
  cancel-in-progress: true

# 최소 권한만 부여 - GHCR push에 필요한 packages:write, checkout에 필요한 contents:read.
permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/arcguard-backend

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    # FiresafetyApplicationTests.contextLoads()가 전체 Spring context(DataSource/Flyway/MyBatis 포함)를
    # 띄운다 - 로컬은 spring.config.import: optional:file:.env[.properties]로 .env를 읽어 통과하지만,
    # .env는 gitignore 대상이라 CI 체크아웃에는 없다. production MySQL/credential을 쓰는 대신, 실제
    # Flyway 마이그레이션/MyBatis 매퍼를 production과 동일한 mysql:8.0으로 검증하기 위해 CI 전용
    # service container를 띄운다(아래 env의 DB_USERNAME/DB_PASSWORD/JWT_SECRET_KEY는 이 job 안에서만
    # 쓰이는 더미 값 - production 값과 무관하고 실제 인증/암호화에 쓰이지 않는다).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: arcguard_test
          MYSQL_USER: ci_test_user
          MYSQL_PASSWORD: ci_test_password
          MYSQL_ROOT_PASSWORD: ci_test_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle test
        env:
          DB_URL: jdbc:mysql://localhost:3306/arcguard_test
          DB_USERNAME: ci_test_user
          DB_PASSWORD: ci_test_password
          JWT_ISSUER: ci-test-issuer
          JWT_BEARER_FORMAT: JWT
          JWT_CLAIM_KEY: user
          # openssl rand -base64 32 상당의 CI 전용 더미 키 - production JWT_SECRET_KEY와 무관하며
          # 여기서 서명된 토큰은 이 job 밖에서 검증되지 않는다.
          JWT_SECRET_KEY: QfqbClEImNVTtWuVRE7dp8lGa3GITuuuVHaFwNr27DM=
          JWT_ACCESS_TOKEN_COOKIE_NAME: at
          JWT_ACCESS_TOKEN_COOKIE_PATH: /
          JWT_ACCESS_TOKEN_COOKIE_VALIDITY_SECONDS: "3600"
          JWT_ACCESS_TOKEN_VALIDITY_MILLISECONDS: "3600000"
          JWT_REFRESH_TOKEN_COOKIE_NAME: rt
          JWT_REFRESH_TOKEN_COOKIE_PATH: /api/auth
          JWT_REFRESH_TOKEN_COOKIE_VALIDITY_SECONDS: "604800"
          JWT_REFRESH_TOKEN_VALIDITY_MILLISECONDS: "604800000"
        run: ./gradlew test --no-daemon

      - name: Gradle build (jar only, skip tests already run above)
        run: ./gradlew bootJar -x test --no-daemon

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 (pull + restart backend only)
        # EC2 SSH 개인키를 다루는 third-party action이라 major tag가 아니라 커밋 SHA로 고정한다
        # (v1.2.5, https://github.com/appleboy/ssh-action/releases/tag/v1.2.5)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/arcguard
            export IMAGE_TAG=${{ needs.test-and-build.outputs.image_tag }}
            docker compose --env-file .env.production pull backend
            docker compose --env-file .env.production up -d --no-deps backend

            # backend가 재생성되면 arcguard-net에서 새 IP를 받는데, nginx는 proxy_pass 대상 호스트를
            # 설정 로드/reload 시점에만 resolve하고 캐싱한다 - reload하지 않으면 이후 요청이 전부
            # 옛 IP로 502가 난다(2026-09-04 실측). health-check보다 먼저 해야 한다 - 순서가 반대면
            # stale IP로 인한 502를 health-check가 먼저 만나 set -e로 여기까지 못 온다.
            docker exec arcguard-nginx nginx -t
            docker exec arcguard-nginx nginx -s reload

            ./deploy/scripts/health-check.sh backend
