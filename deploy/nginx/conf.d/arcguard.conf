# =====================================================================
# ArcGuard 통합 진입점 (Phase 14, AWS EC2 확정: 외부 개방 포트는 80/443)
# 프론트/REST API/WebSocket/하드웨어 수신을 전부 이 nginx 하나로 받아 경로별로 컨테이너에 분기한다.
# backend/ai-service/mysql은 Docker 내부망(arcguard-net)에서만 접근 가능 - 이 파일 밖에서
# 직접 외부에 노출되지 않는다.
#
# 운영 도메인 확정: arcguard.duckdns.org (DuckDNS에 EC2 Public IPv4가 이미 연결됨, Phase 15).
# 아직 인증서를 발급하지 않았으므로 443 블록은 비활성화 상태로 유지하고, HTTP→HTTPS 강제
# redirect도 걸지 않는다(로그인 쿠키가 HTTP에서도 계속 동작해야 함 - JWT_COOKIE_SECURE=false 참고).
# default_server를 유지하는 이유: health-check.sh가 EC2 내부에서 http://localhost/ 로 호출하는데
# Host 헤더가 도메인과 다르므로, default_server가 없으면 이 요청이 이 server 블록에 매칭되지 않는다.
# 다음 Phase(Let's Encrypt 발급 후): 443 블록 활성화 + 이 80 블록을 443으로 redirect하도록 전환.
# =====================================================================
server {
    listen 80 default_server;
    server_name arcguard.duckdns.org;

    # 레거시 센서 하드웨어 수신 - 표준 REST 컨벤션 예외 경로, 임의로 바꾸지 않는다
    location /m_noUpload.php {
        proxy_pass http://backend:8080/m_noUpload.php;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # REST API
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket(STOMP) 관제화면 실시간 채널
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI (운영 노출 여부는 별도 결정 필요, 필요 없으면 이 블록 삭제)
    location /swagger-ui.html {
        proxy_pass http://backend:8080/swagger-ui.html;
        proxy_set_header Host $host;
    }
    location /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
        proxy_set_header Host $host;
    }

    # 프론트엔드 정적 파일 (SPA) - 위 경로들에 안 걸리는 나머지 전부
    # ai-service(FastAPI)는 의도적으로 이 파일에 어떤 location도 없다 - 외부에서 직접 접근 불가,
    # backend가 Docker 내부망으로만 호출한다(3절 원칙).
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}

