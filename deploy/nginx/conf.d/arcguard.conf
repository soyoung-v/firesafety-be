# =====================================================================
# ArcGuard 통합 진입점 (Phase 16, 2026-09-03 - Let's Encrypt 발급 완료 후 HTTPS 전환)
# 프론트/REST API/WebSocket/하드웨어 수신을 전부 이 nginx 하나로 받아 경로별로 컨테이너에 분기한다.
# backend/ai-service/mysql은 Docker 내부망(arcguard-net)에서만 접근 가능 - 이 파일 밖에서
# 직접 외부에 노출되지 않는다.
#
# 운영 도메인: arcguard.duckdns.org. 인증서는 certbot(webroot, /var/www/certbot 공유 볼륨)으로
# 발급했고 deploy/nginx/certs/live/arcguard.duckdns.org/에 있다(Git 커밋 금지, 서버에만 존재).
# 80은 ACME challenge 응답 + 나머지 전부 443으로 301 redirect만 한다(로그인 등 실제 트래픽은
# 전부 HTTPS). default_server를 유지하는 이유: health-check.sh가 EC2 내부에서
# http://localhost/ 로 호출하는데 Host 헤더가 도메인과 다르므로, default_server가 없으면
# 이 요청이 이 server 블록에 매칭되지 않는다.
# =====================================================================
server {
    listen 80 default_server;
    server_name arcguard.duckdns.org;

    # Let's Encrypt HTTP-01 challenge - certbot webroot 플러그인이 이 경로에 파일을 쓰고,
    # Let's Encrypt 서버가 http(80)로 그대로 조회해 도메인 소유를 검증한다. 인증서 갱신 때도
    # 계속 쓰이므로 아래 redirect보다 먼저(더 구체적인 prefix라 우선 매치) 두고 예외로 둔다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name arcguard.duckdns.org;

    ssl_certificate     /etc/nginx/certs/live/arcguard.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/arcguard.duckdns.org/privkey.pem;

    # 레거시 센서 하드웨어 수신 - 표준 REST 컨벤션 예외 경로, 임의로 바꾸지 않는다.
    # TBD: 실제 하드웨어가 HTTPS/redirect를 지원하지 못하면 이 경로만 80에 별도 예외가
    # 필요할 수 있다(현재는 SENSOR_MOCK_ENABLED로 목업 중이라 실기기 연동 시 재검토).
    location /m_noUpload.php {
        proxy_pass http://backend:8080/m_noUpload.php;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # REST API
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket(STOMP) 관제화면 실시간 채널 - 프론트가 location.protocol 기반으로 wss://를
    # 쓰므로 여기(443)로 들어온다.
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI (운영 노출 여부는 별도 결정 필요, 필요 없으면 이 블록 삭제)
    location /swagger-ui.html {
        proxy_pass http://backend:8080/swagger-ui.html;
        proxy_set_header Host $host;
    }
    location /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
        proxy_set_header Host $host;
    }

    # 프론트엔드 정적 파일 (SPA) - 위 경로들에 안 걸리는 나머지 전부
    # ai-service(FastAPI)는 의도적으로 이 파일에 어떤 location도 없다 - 외부에서 직접 접근 불가,
    # backend가 Docker 내부망으로만 호출한다(3절 원칙).
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
