# =====================================================================
# firesafety 통합 진입점 (2026-07-28 확정: 외부 개방 포트는 22222 하나뿐)
# 프론트/REST API/WebSocket/하드웨어 수신을 전부 이 포트 하나로 받아 경로별로 분기한다.
# 레거시 센서 디바이스는 구형 프로토콜(GET 쿼리스트링)이라 TLS를 못 다룰 가능성이 높아
# HTTP 1차 배포는 평문으로 서비스하고, HTTPS는 도메인/인증서 확정 후 2차로 적용한다.
# =====================================================================
server {
    listen 22222 default_server;
    server_name 127.0.0.1;

    # 레거시 센서 하드웨어 수신 — 표준 REST 컨벤션 예외 경로, 임의로 바꾸지 않는다
    location /m_noUpload.php {
        proxy_pass http://backend:8080/m_noUpload.php;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # REST API
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket(STOMP) 관제화면 실시간 채널
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI (운영 노출 여부는 별도 결정 필요, 필요 없으면 이 블록 삭제)
    location /swagger-ui.html {
        proxy_pass http://backend:8080/swagger-ui.html;
        proxy_set_header Host $host;
    }
    location /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
        proxy_set_header Host $host;
    }

    # 프론트엔드 정적 파일 (SPA) — 위 경로들에 안 걸리는 나머지 전부
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}

