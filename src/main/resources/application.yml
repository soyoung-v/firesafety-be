server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: firesafety # 프로젝트 이름

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*/*.xml

constants:
  jwt:
    issuer: ${JWT_ISSUER}
    bearer-format: ${JWT_BEARER_FORMAT}
    claim-key: ${JWT_CLAIM_KEY}
    secret-key: ${JWT_SECRET_KEY}
    access-token-cookie-name: ${JWT_ACCESS_TOKEN_COOKIE_NAME}
    access-token-cookie-path: ${JWT_ACCESS_TOKEN_COOKIE_PATH}
    access-token-cookie-validity-seconds: ${JWT_ACCESS_TOKEN_COOKIE_VALIDITY_SECONDS}
    access-token-validity-milliseconds: ${JWT_ACCESS_TOKEN_VALIDITY_MILLISECONDS}
    refresh-token-cookie-name: ${JWT_REFRESH_TOKEN_COOKIE_NAME}
    refresh-token-cookie-path: ${JWT_REFRESH_TOKEN_COOKIE_PATH}
    refresh-token-cookie-validity-seconds: ${JWT_REFRESH_TOKEN_COOKIE_VALIDITY_SECONDS}
    refresh-token-validity-milliseconds: ${JWT_REFRESH_TOKEN_VALIDITY_MILLISECONDS}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}

  cors:
    # 콤마로 구분된 목록 — 배포 주소(IP/도메인)가 바뀔 때마다 코드 재빌드 없이 이 값만 바꾸면 됨
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:4173,http://192.0.2.10:5173,http://192.0.2.11:5173,http://192.0.2.11:5174}

  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_SUPER_ADMIN_ENABLED:false}
      email: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
      name: ${BOOTSTRAP_SUPER_ADMIN_NAME:최고관리자}
      phone: ${BOOTSTRAP_SUPER_ADMIN_PHONE:}

  firebase:
    enabled: ${FIREBASE_ENABLED:false}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

  address-search:
    api-key: ${JUSO_API_KEY:}
    search-url: ${JUSO_SEARCH_URL:https://business.juso.go.kr/addrlink/addrLinkApi.do}

  ai-prediction:
    enabled: ${AI_PREDICTION_ENABLED:false}
    base-url: ${AI_PREDICTION_BASE_URL:http://localhost:8000}
    path: ${AI_PREDICTION_PATH:/predict}
    min-sample-size: ${AI_PREDICTION_MIN_SAMPLE_SIZE:30}
    sample-size: ${AI_PREDICTION_SAMPLE_SIZE:120}
    scheduler-delay-ms: ${AI_PREDICTION_SCHEDULER_DELAY_MS:60000}
    scheduler-initial-delay-ms: ${AI_PREDICTION_SCHEDULER_INITIAL_DELAY_MS:60000}

  # LLM 진단 설명(POST /explain) 기능 - base-url은 위 ai-prediction.base-url을 그대로 재사용한다(같은 서버)
  ai-explanation:
    enabled: ${AI_EXPLANATION_ENABLED:false}
    path: ${AI_EXPLAIN_PATH:/explain}

  password-reset:
    base-url: ${PASSWORD_RESET_BASE_URL:}
    token-expiration-minutes: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:30}
    mail-from-address: ${MAIL_FROM_ADDRESS:}
    mail-from-name: ${MAIL_FROM_NAME:아크가드 ArcGuard}
    rate-limit-window-minutes: ${PASSWORD_RESET_RATE_LIMIT_WINDOW_MINUTES:10}
    rate-limit-max-count: ${PASSWORD_RESET_RATE_LIMIT_MAX_COUNT:5}

  sensor-mock:
    enabled: ${SENSOR_MOCK_ENABLED:false}
    delay-ms: ${SENSOR_MOCK_DELAY_MS:5000}
    ai-delay-ms: ${SENSOR_MOCK_AI_DELAY_MS:20000}

  # SW 버전 정보 화면(REQ-702)용 정적 값. 배포 시 실제 값으로 환경변수만 갱신하면 코드 재빌드 없이 반영됨
  system:
    version: ${APP_VERSION:0.0.1-SNAPSHOT}
    build-date: ${APP_BUILD_DATE:}
    changelog-url: ${APP_CHANGELOG_URL:}
    registration-info: ${APP_REGISTRATION_INFO:}

monitoring:
  communication-lost-check-delay-ms: ${COMMUNICATION_LOST_CHECK_DELAY_MS:30000}
  communication-lost-check-initial-delay-ms: ${COMMUNICATION_LOST_CHECK_INITIAL_DELAY_MS:30000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
