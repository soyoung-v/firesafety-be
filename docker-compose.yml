# ArcGuard AWS EC2 배포 (Phase 14, 2026-09-03 확정 - GHCR 기반 CI/CD로 전환)
#
# - GitHub Actions가 각 repo(frontend/backend/ai-service)를 GHCR에 image로 push하고,
#   EC2는 image를 pull만 한다 - EC2에서 소스 빌드(gradle/npm/pip)를 하지 않는다.
# - 외부 공개 포트는 80/443뿐(Nginx). backend/ai-service/mysql은 Docker 내부망(arcguard-net)
#   에서만 접근 가능하고 호스트 포트로 노출하지 않는다.
# - MySQL은 RDS가 아니라 이 Compose 안에서 직접 운영하며, named volume(arcguard-mysql-data)으로
#   컨테이너 교체와 무관하게 데이터를 보존한다. `docker compose down -v`는 이 스택에서 절대
#   실행하지 않는다 - 실행하면 이 volume이 삭제된다.
# - 배포: 서비스별 부분 배포만 한다(다른 서비스는 건드리지 않음).
#     docker compose --env-file .env.production pull <service>
#     docker compose --env-file .env.production up -d --no-deps <service>
#   자세한 절차는 deploy/scripts/deploy.sh, deploy/README.md 참고.
# - Firebase Admin SDK JSON은 이미지/GHCR/Git 어디에도 포함하지 않는다 - EC2 host의
#   ~/arcguard/secrets/firebase-credentials.json을 읽기 전용으로 마운트한다(10절 참고).

name: arcguard

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: arcguard-nginx
    environment:
      - TZ=Asia/Seoul
    ports:
      - "80:80"
      - "443:443"
    # :Z 접미사 - Amazon Linux 2023은 SELinux가 활성화돼 있어 bind mount에 이게 없으면
    # 컨테이너가 파일을 못 읽을 수 있다(AVC denial).
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro,Z
      # Let's Encrypt가 실제로 발급한 인증서(서버에서만 존재, Git 커밋 금지) - certbot 서비스가
      # 같은 호스트 경로에 /etc/letsencrypt로 쓰기 때문에 certbot 관점의 live/archive/renewal
      # 디렉터리 구조가 그대로 nginx에도 보인다.
      - ./deploy/nginx/certs:/etc/nginx/certs:ro,Z
      # certbot webroot(HTTP-01 challenge 파일) - certbot 컨테이너와 공유
      - ./deploy/nginx/certbot-www:/var/www/certbot:ro,Z
    depends_on:
      - backend
      - frontend
    networks:
      - arcguard-net
    restart: unless-stopped
    logging: *default-logging

  # 인증서 발급/갱신 전용 - 상시 기동하지 않고 `docker compose run --rm certbot ...`으로만 실행한다.
  # webroot 방식: 이 컨테이너는 파일만 /var/www/certbot에 쓰고, 실제 HTTP-01 응답은 nginx가 한다.
  certbot:
    image: certbot/certbot:latest
    container_name: arcguard-certbot
    # profiles로 기본 `up`/`up -d`(서비스명 생략) 대상에서 제외한다 - 이 서비스는 항상
    # `docker compose run --rm -T certbot ...`으로만 1회성 실행한다(renew-cert.sh 참고).
    profiles:
      - certbot
    volumes:
      - ./deploy/nginx/certs:/etc/letsencrypt
      - ./deploy/nginx/certbot-www:/var/www/certbot
    logging: *default-logging

  frontend:
    image: ghcr.io/soyoung-v/arcguard-frontend:${IMAGE_TAG:-latest}
    container_name: arcguard-frontend
    environment:
      - TZ=Asia/Seoul
    networks:
      - arcguard-net
    restart: unless-stopped
    logging: *default-logging

  backend:
    image: ghcr.io/soyoung-v/arcguard-backend:${IMAGE_TAG:-latest}
    container_name: arcguard-backend
    environment:
      - TZ=Asia/Seoul
    env_file:
      - .env.production
    # Firebase Admin SDK 인증 파일 - FIREBASE_ENABLED=false인 동안은 마운트돼 있어도 앱이
    # 안 읽으므로 안전하다. 서버 배포 경로 확정: ~/arcguard (secrets/*.json은 SFTP로 미리
    # 올려둘 것, Git 커밋 금지).
    volumes:
      - ./secrets/firebase-credentials.json:/app/secrets/firebase-credentials.json:ro,Z
    # 외부 포트 매핑 없음 (nginx를 통해서만 접근)
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - arcguard-net
    restart: unless-stopped
    logging: *default-logging

  ai-service:
    image: ghcr.io/soyoung-v/arcguard-ai:${IMAGE_TAG:-latest}
    container_name: arcguard-ai-service
    environment:
      - TZ=Asia/Seoul
    env_file:
      - .env.production
    healthcheck:
      # localhost가 아니라 127.0.0.1 - 컨테이너에서 IPv6가 비활성화돼 있어(disable_ipv6=1)
      # localhost가 ::1로도 resolve되면 urllib이 폴백 시도 중 EADDRNOTAVAIL로 실패 원인을 가린다.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # 외부 노출 없음. backend가 내부 네트워크(arcguard-net)로만 호출한다.
    # OPENAI_API_KEY는 .env.production을 통해 이 컨테이너에만 전달된다 - React/Spring Boot/
    # GitHub repo/Docker image layer 어디에도 포함되지 않는다.
    networks:
      - arcguard-net
    restart: unless-stopped
    logging: *default-logging

  mysql:
    image: mysql:8.0
    container_name: arcguard-mysql
    environment:
      TZ: Asia/Seoul
      MYSQL_DATABASE: arcguard_db
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - arcguard-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 127.0.0.1(루프백)에만 바인딩 - 인터넷은 물론 EC2 보안그룹 설정과 무관하게 컨테이너
    # 자체가 외부 인터페이스로 3306을 열지 않는다. DB 관리 도구(Workbench 등)로 볼 때는
    # `ssh -L 23306:localhost:23306 ec2-user@<host>` 같은 SSH 터널을 거쳐야만 접근 가능.
    ports:
      - "127.0.0.1:23306:3306"
    networks:
      - arcguard-net
    restart: unless-stopped
    logging: *default-logging

networks:
  arcguard-net:
    driver: bridge

volumes:
  # 운영 DB 데이터. `docker compose down -v`는 이 볼륨을 삭제하니 절대 쓰지 않는다.
  # name을 명시적으로 고정 - 안 하면 프로젝트명(arcguard)에 따라 실제 볼륨명이 자동으로 바뀐다.
  arcguard-mysql-data:
    name: arcguard-mysql-data
