# ArcGuard(firesafety) 온프레미스 배포 (2026-07-28 확정)
#
# - 외부에서 열 수 있는 포트는 22222(SENSOR_RECV_HTTP) 하나. 하드웨어/API/WebSocket/프론트 전부
#   nginx가 이 포트 하나로 받아 경로별로 분기한다 (deploy/nginx/conf.d/firesafety.conf 참고).
# - 이번 범위는 수동 배포다. 로컬(Mac)에서 이미지를 빌드 → tar로 저장 → SFTP로 서버 전달 →
#   서버에서 docker load → docker compose up -d 순서. GitHub Actions/Harbor/ArgoCD/Watchtower는 안 씀.
# - backend 서비스는 이 레포(firesafety-be)와 같은 위치에 있어 build 블록으로 로컬 빌드도 가능하다.
#   frontend/ai-service는 별도 레포라 build 블록을 두지 않고, 각 레포에서 직접
#   `docker build`로 이미지를 만든 뒤 아래 image 이름/태그로 맞춰서 docker load 한다.
# - 1차 기본 배포(AI 서비스 이미지 미확정 상태): docker compose --env-file .env.production up -d
#   ai-service는 profiles: ["ai"]로 분리돼 있어 기본 up에는 포함되지 않는다 (이미지가 없어도 실패하지 않음).
#   AI 서비스 이미지가 준비되면: docker compose --env-file .env.production --profile ai up -d
#   (--env-file을 꼭 지정해야 mysql 서비스의 ${DB_USERNAME} 등 치환값도 .env.production을 본다)
# - 상세 절차는 deploy/manual-deploy-guide.md 참고.

name: arcguard

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: arcguard-nginx
    environment:
      - TZ=Asia/Seoul
    ports:
      - "22222:22222"
    # :Z 접미사 — 서버가 SELinux Enforcing이라 bind mount에 이게 없으면 컨테이너가 파일을 못 읽는다(AVC denial)
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro,Z
      # HTTPS 2차 전환 시 실제 인증서 파일을 서버에서만 이 디렉터리에 둔다 (Git 커밋 금지)
      - ./deploy/nginx/certs:/etc/nginx/certs:ro,Z
    depends_on:
      - backend
      - frontend
    networks:
      - firesafety-net
    restart: unless-stopped
    logging: *default-logging

  backend:
    image: arcguard-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arcguard-backend
    environment:
      - TZ=Asia/Seoul
    env_file:
      - .env.production
    # HTTPS 2차 전환 때 FIREBASE_ENABLED=true로 켤 예정이라 파일은 미리 마운트해둔다.
    # FIREBASE_ENABLED=false인 동안은 이 파일이 마운트돼 있어도 앱이 안 읽으므로 안전하다.
    # 서버 배포 경로 확정: /home/arcguard (SFTP로 이 파일만 미리 올려둘 것, Git 커밋 금지)
    volumes:
      - /home/arcguard/secrets/firebase-credentials.json:/app/secrets/firebase-credentials.json:ro,Z
    # 외부 포트 매핑 없음 (nginx를 통해서만 접근)
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - firesafety-net
    restart: unless-stopped
    logging: *default-logging

  frontend:
    # firesafety-fe 레포에서 별도로 빌드한 이미지. 이 레포에는 소스가 없어 build 블록을 두지 않는다.
    # 빌드: firesafety-fe 레포 루트에서 `docker build -t arcguard-frontend:latest .`
    image: arcguard-frontend:latest
    container_name: arcguard-frontend
    environment:
      - TZ=Asia/Seoul
    networks:
      - firesafety-net
    restart: unless-stopped
    logging: *default-logging

  ai-service:
    # 아크 예측 API (FastAPI + scikit-learn, CPU 추론만 사용, GPU 불필요).
    # 포트 8000/health 경로 확정됨(2026-07-29) — AI_PREDICTION_BASE_URL과 일치.
    # 이미지 빌드: ai-service 레포 루트에서 `docker buildx build --platform linux/amd64 -t arcguard-ai-service:latest --load .`
    # profiles로 분리 — 이미지가 없어도 기본 `docker compose up -d`가 실패하지 않는다.
    # AI_PREDICTION_ENABLED=false인 동안 backend는 이 서비스가 없어도 정상 기동/운영된다 (manual-deploy-guide.md 참고).
    profiles: ["ai"]
    image: arcguard-ai-service:latest
    container_name: arcguard-ai-service
    environment:
      - TZ=Asia/Seoul
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    env_file:
      - .env.production
    # 외부 노출 없음. backend가 내부 네트워크(firesafety-net)로만 호출한다.
    networks:
      - firesafety-net
    restart: unless-stopped
    logging: *default-logging

  mysql:
    image: mysql:8.0
    container_name: arcguard-mysql
    environment:
      TZ: Asia/Seoul
      MYSQL_DATABASE: arcguard_db
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - firesafety-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 127.0.0.1(루프백)에만 바인딩 — LAN(192.168.0.22)이나 외부에는 노출 안 됨.
    # DB 관리 도구(Workbench 등)로 볼 때는 SSH 터널을 거쳐야만 접근 가능.
    ports:
      - "22223:3306"
    networks:
      - firesafety-net
    restart: unless-stopped
    logging: *default-logging

networks:
  firesafety-net:
    driver: bridge

volumes:
  # 운영 DB 데이터. `docker compose down -v`는 이 볼륨을 삭제하니 운영 서버에서 절대 쓰지 않는다.
  # name을 명시적으로 고정 — 안 하면 프로젝트명(arcguard)에 따라 실제 볼륨명이 자동으로 바뀐다.
  firesafety-mysql-data:
    name: arcguard-mysql-data
